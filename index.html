<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101322"><title>リズム・メトロノーム</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#232943,#101322 65%);color:#f3f5fc;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}.app{width:min(100%,440px);background:#1d2235;border:1px solid #363d57;border-radius:26px;padding:25px;box-shadow:0 18px 55px #06081480}h1{font-size:23px;margin:0 0 6px}.sub{color:#a9b3cf;font-size:13px;margin:0 0 25px}.pulse{width:118px;height:118px;border-radius:50%;margin:10px auto 22px;background:#333d64;display:grid;place-items:center;transition:transform .08s,background .08s;box-shadow:0 0 0 10px #30395555}.pulse.hit{background:#8e8aff;transform:scale(1.12)}.pulse span{font-size:15px;letter-spacing:1px}.tempo{text-align:center;font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.unit{text-align:center;color:#adb8d7;font-size:13px;margin:5px 0 24px}.slider{width:100%;accent-color:#9b96ff}.range{display:flex;justify-content:space-between;color:#9ea9c6;font-size:12px;margin:7px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{background:#323b57;color:#f1f3fc;border:1px solid #4a5475;border-radius:13px;padding:14px 5px;font-size:15px;font-weight:650;cursor:pointer}.mode.selected{background:#6664bd;border-color:#aaa7ff}.mode:active,button:active{transform:scale(.98)}.primary{width:100%;background:#a5a0ff;color:#16172d;border:0;border-radius:15px;font-size:18px;font-weight:800;padding:17px;margin-top:19px;cursor:pointer}.secondary{width:100%;background:transparent;color:#d0d6ed;border:1px solid #535d7c;border-radius:12px;padding:12px;margin-top:10px;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;margin:21px 0 0;gap:12px}.row label{font-size:14px}.row input{width:80px;background:#101529;color:white;border:1px solid #576183;border-radius:9px;padding:9px;font-size:16px}.status{text-align:center;color:#b8c2e0;min-height:20px;margin-top:16px;font-size:13px}.foot{color:#7f8ba9;font-size:11px;text-align:center;margin-top:18px}</style></head><body><main class="app"><h1>リズム・メトロノーム</h1><p class="sub">速度変更・リズム停止・カウントダウン</p><div id="pulse" class="pulse"><span id="beatText">READY</span></div><div id="bpmValue" class="tempo">80</div><div class="unit">BPM / 1分あたりの拍数</div><input id="bpm" class="slider" type="range" min="30" max="240" value="80" aria-label="テンポ"><div class="range"><span>30 BPM</span><span>240 BPM</span></div><div class="grid"><button class="mode selected" data-mode="normal">通常 80</button><button class="mode" data-mode="fast">高速 160</button><button class="mode" data-mode="slow">ゆっくり 50</button><button class="mode" data-mode="pause">一時停止</button><button class="mode" data-mode="shortstop">寸前で停止</button><button class="mode" data-mode="random">ランダム</button></div><div class="row"><label for="seconds">自動停止タイマー（秒）</label><input type="number" id="seconds" min="0" max="3600" value="0"></div><button id="start" class="primary">▶ スタート</button><button id="reset" class="secondary">リセット</button><div id="status" class="status" aria-live="polite">準備完了</div><p class="foot">音を出すにはスタートを押してください。端末の音量にもご注意ください。</p></main><script>(()=>{const bpm=document.querySelector('#bpm'),display=document.querySelector('#bpmValue'),pulse=document.querySelector('#pulse'),beatText=document.querySelector('#beatText'),start=document.querySelector('#start'),status=document.querySelector('#status'),seconds=document.querySelector('#seconds');let audio=null,running=false,timer=null,timeout=null,rand=null,beat=0,current='normal',lastBpm=80,started=0;const modes=[...document.querySelectorAll('.mode')];function sound(){if(!audio)return;let osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type='sine';osc.frequency.setValueAtTime(beat%4===0?950:700,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.22,t+.006);gain.gain.exponentialRampToValueAtTime(.0001,t+.075);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+.08)}function tick(){beat++;sound();beatText.textContent=String((beat-1)%4+1);pulse.classList.add('hit');setTimeout(()=>pulse.classList.remove('hit'),90)}function clear(){clearInterval(timer);clearTimeout(timeout);clearInterval(rand);timer=timeout=rand=null}function halt(msg='停止中'){running=false;clear();beatText.textContent='STOP';start.textContent='▶ スタート';status.textContent=msg}function schedule(){clearInterval(timer);if(!running)return;let interval=60000/Number(bpm.value);tick();timer=setInterval(tick,interval)}function setBpm(n){bpm.value=n;display.textContent=bpm.value;if(running)schedule()}function select(mode){current=mode;modes.forEach(m=>m.classList.toggle('selected',m.dataset.mode===mode));if(mode==='pause'){halt('一時停止しました');return}if(mode==='shortstop'){if(running){status.textContent='あと4拍で停止します';let wait=4*60000/Number(bpm.value);clearTimeout(timeout);timeout=setTimeout(()=>halt('指定の位置で停止しました'),wait)}else status.textContent='再生中に選択すると4拍後に停止します';return}if(mode==='normal')setBpm(80);if(mode==='fast')setBpm(160);if(mode==='slow')setBpm(50);if(mode==='random'){if(!running){status.textContent='スタートすると速度が自動で変わります';return}startRandom();return}if(running)status.textContent='再生中'}function startRandom(){clearInterval(rand);rand=setInterval(()=>{if(!running)return;const opts=[50,80,110,140,180];setBpm(opts[Math.floor(Math.random()*opts.length)]);status.textContent='ランダム速度: '+bpm.value+' BPM'},4000)}bpm.addEventListener('input',()=>{display.textContent=bpm.value;if(running)schedule();modes.forEach(m=>m.classList.remove('selected'))});modes.forEach(m=>m.addEventListener('click',()=>select(m.dataset.mode)));start.addEventListener('click',async()=>{if(running){halt('停止しました');return}if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(!C){status.textContent='このブラウザは音声に対応していません';return}audio=new C()}await audio.resume();running=true;beat=0;start.textContent='■ 停止';status.textContent='再生中';schedule();if(current==='random')startRandom();const s=Number(seconds.value);if(s>0&&Number.isFinite(s))timeout=setTimeout(()=>halt('タイマーが終了しました'),Math.min(s,3600)*1000)});document.querySelector('#reset').addEventListener('click',()=>{halt('準備完了');beat=0;beatText.textContent='READY';select('normal');seconds.value=0});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)halt('画面を閉じたため停止しました')})})();</script></body></html>
